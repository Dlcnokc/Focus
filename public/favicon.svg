<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Same dark surface as the app bg -->
  <rect width="32" height="32" rx="8" fill="#0a0a0a"/>
  <!-- Thicker glow — brighter core, wider smooth falloff -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#glow)"/>
  <!-- Black dot with a thinner white outline -->
  <circle cx="16" cy="16" r="5.5" fill="#0a0a0a" stroke="#ffffff" stroke-width="1.1"/>
</svg>
