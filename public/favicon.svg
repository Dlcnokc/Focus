<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Same dark surface as the app bg -->
  <rect width="32" height="32" rx="8" fill="#0a0a0a"/>
  <!-- Slight glow — smooth radial falloff (matches .app__mark box-shadow) -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="13" fill="url(#glow)"/>
  <!-- Black dot with white outline — the header mark next to "Focus" -->
  <circle cx="16" cy="16" r="5.5" fill="#0a0a0a" stroke="#ffffff" stroke-width="1.75"/>
</svg>
